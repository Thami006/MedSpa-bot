<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glow Med Spa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', serif;
      background: #fdf6f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 400px;
      height: 580px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background: #c9a96e;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .chat-header h2 { font-size: 18px; letter-spacing: 1px; }
    .chat-header p { font-size: 12px; opacity: 0.85; margin-top: 4px; }
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .bot {
      background: #f5ede0;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .user {
      background: #c9a96e;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .chat-input {
      display: flex;
      padding: 16px;
      border-top: 1px solid #f0e6d8;
      gap: 10px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #e0d0bc;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
      background: #fdf6f0;
    }
    .chat-input button {
      background: #c9a96e;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
    .chat-input button:hover { background: #b8935a; }
    .typing { font-size: 13px; color: #aaa; align-self: flex-start; padding: 4px 8px; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h2>✨ Glow Med Spa</h2>
      <p>We typically reply instantly</p>
    </div>
    <div class="chat-messages" id="messages">
      <div class="message bot">Hi! Welcome to Glow Med Spa 💆‍♀️ How can I help you today?</div>
    </div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Ask us anything..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");
    let conversationHistory = [];

    input.addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerText = "Typing...";
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: conversationHistory })
      });

      const data = await res.json();
      messages.removeChild(typing);
      appendMessage(data.reply, "bot");
    }

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `message ${sender}`;
      div.innerText = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      conversationHistory.push({ role: sender === "user" ? "user" : "assistant", content: text });
    }
  </script>
</body>
</html>
